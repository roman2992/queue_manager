[project]
name = "queue-manager-api"
version = "0.2.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1", "alembic>=1.15,<2", "pydantic-settings>=2.7,<3",
  "redis>=5,<6", "celery>=5.4,<6", "psycopg[binary]>=3.2,<4", "PyJWT>=2.10,<3",
]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
include = ["app*"]