services:
  api:
    build: ./apps/api
    env_file: .env
    ports: ["8000:8000"]
    depends_on: [postgres, redis]
  worker:
    build: ./apps/api
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO
    env_file: .env
    depends_on: [postgres, redis]
  beat:
    build: ./apps/api
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=INFO
    env_file: .env
    depends_on: [postgres, redis]
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: queue_manager
      POSTGRES_USER: queue_manager
      POSTGRES_PASSWORD: queue_manager
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata:
